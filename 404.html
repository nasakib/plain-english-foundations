<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — The Plain-English Foundations Library</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <style>
    :root {
      --bg: #faf8f4;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #57534e;
      --border: #e5dfd3;
    }
    html[data-theme="sepia"] {
      --bg: #f4ecd8;
      --surface: #fbf6ea;
      --text: #2c2219;
      --text-muted: #695847;
      --border: #dfd1b5;
    }
    html[data-theme="night"] {
      --bg: #111318;
      --surface: #181b22;
      --text: #e7e5e4;
      --text-muted: #a8a29e;
      --border: #2b303d;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }
    .card {
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid #2563eb;
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .code {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #2563eb;
      background: rgba(37, 99, 235, 0.12);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.85rem;
    }
    h1 {
      font-family: "Charter", "Georgia", serif;
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
    }
    p {
      color: var(--text-muted);
      line-height: 1.65;
      margin: 0 0 1.4rem;
    }
    a {
      display: inline-block;
      padding: 0.58rem 1.2rem;
      border-radius: 999px;
      background: #2563eb;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
    }
    a:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 &middot; Shelf Not Found</div>
    <h1>Page Not Found</h1>
    <p>That shelf in The Plain-English Foundations Library does not exist. Return to the main library index to browse all six volumes and ninety isolated concepts.</p>
    <a href="./index.html">Return to Library Index</a>
  </main>
  <script>
    document.documentElement.setAttribute('data-theme', localStorage.getItem('plain-books-theme') || 'paper');
  </script>
</body>
</html>
