<!DOCTYPE html>
<html lang="en" data-theme="paper">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found — The Plain-English Foundations Library</title>
  <link rel="icon" type="image/svg+xml" href="./icons/icon.svg" />
  <style>
    :root {
      --bg: #f7f4ed;
      --surface: #ffffff;
      --text: #1c1917;
      --text-muted: #524d47;
      --border: #e2dacb;
    }
    html[data-theme="sepia"] {
      --bg: #efe4cd;
      --surface: #fbf5e7;
      --text: #2c2118;
      --text-muted: #5f4e3d;
      --border: #d9c7a3;
    }
    html[data-theme="night"] {
      --bg: #0d1017;
      --surface: #151923;
      --text: #ece9e4;
      --text-muted: #aeb6c4;
      --border: #2a3142;
    }
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      background: var(--bg);
      color: var(--text);
      font-family: "Inter", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      padding: 1.5rem;
    }
    .card {
      max-width: 520px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: 5px solid #059669;
      border-radius: 20px;
      padding: 2.25rem;
      box-shadow: 0 12px 34px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .code {
      display: inline-block;
      font-size: 0.78rem;
      font-weight: 700;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: #059669;
      background: rgba(5, 150, 105, 0.11);
      padding: 0.25rem 0.7rem;
      border-radius: 999px;
      margin-bottom: 0.85rem;
    }
    h1 {
      font-family: "Charter", "Georgia", serif;
      margin: 0 0 0.75rem;
      font-size: 1.75rem;
    }
    p {
      color: var(--text-muted);
      line-height: 1.65;
      margin: 0 0 1.4rem;
    }
    a {
      display: inline-block;
      padding: 0.58rem 1.2rem;
      border-radius: 999px;
      background: #059669;
      color: #ffffff;
      font-weight: 700;
      font-size: 0.9rem;
      text-decoration: none;
    }
    a:hover { opacity: 0.92; }
  </style>
</head>
<body>
  <main class="card">
    <div class="code">404 &middot; Page Moved or Missing</div>
    <h1>Page Not Found</h1>
    <p>That shelf in The Plain-English Foundations Library has moved or does not exist. Return to the main library to browse all eight gentle books and ninety-six everyday ideas.</p>
    <a href="./index.html">Open Library Home</a>
  </main>
  <script>
    try {
      var m = document.cookie.match(/(?:^|; )pef_prefs=([^;]+)/);
      var p = m ? JSON.parse(decodeURIComponent(m[1])) : null;
      document.documentElement.setAttribute('data-theme', (p && p.t) || localStorage.getItem('plain-books-theme') || 'paper');
    } catch (e) {}
  </script>
</body>
</html>
